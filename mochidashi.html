<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>持ち出し登録</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1b1f24; --sub: #5f6b7a; --line: #d9dee5;
    --accent: #1f6feb; --accent-ink: #ffffff; --accent-soft: #e7f0fe;
    --good: #1a7f37; --good-soft: #e3f4e8; --warn: #9a6700; --warn-soft: #fff4d6;
    --bad: #c62828; --bad-soft: #fde8e8; --mute-soft: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --card: #181c22; --ink: #e8ebef; --sub: #9aa5b2; --line: #2c333c;
      --accent: #4c8dff; --accent-ink: #0b1220; --accent-soft: #1b2a44;
      --good: #4cc070; --good-soft: #15301f; --warn: #e0b04a; --warn-soft: #33290f;
      --bad: #ff6b6b; --bad-soft: #3a1717; --mute-soft: #222830;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .label { font-size: 13px; color: var(--sub); font-weight: 600; margin-bottom: 8px; display: block; }
  input[type=text], input[type=search], input[type=number] {
    width: 100%; font-size: 17px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); padding: 11px 14px; min-height: 46px; }
  button:disabled { opacity: .45; cursor: default; }
  .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .wide { width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; }
  .scan { width: 100%; font-weight: 700; margin-bottom: 10px; font-size: 17px; }
  #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 10px; background: #000; }
  .results { list-style: none; margin: 8px 0 0; padding: 0; max-height: 300px; overflow-y: auto; }
  .results li { padding: 10px 6px; border-top: 1px solid var(--line); cursor: pointer; }
  .results li:first-child { border-top: 0; }
  .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: var(--sub); }
  .cart { list-style: none; margin: 0; padding: 0; }
  .cart li { border-top: 1px solid var(--line); padding: 10px 0; }
  .cart li:first-child { border-top: 0; padding-top: 0; }
  .cart .nm { font-weight: 600; word-break: break-all; }
  .cart .ctl { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .cart .ctl button { width: 44px; min-height: 40px; padding: 0; font-size: 20px; font-weight: 700; }
  .cart .ctl input { width: 72px; text-align: center; font-size: 18px; font-weight: 700; padding: 8px 4px; }
  .cart .ctl .del { margin-left: auto; width: auto; padding: 0 12px; font-size: 14px; font-weight: 600; color: var(--bad); }
  .cart li.flash { animation: flash 1s ease-out; }
  @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
  .sum { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 14px; color: var(--sub); }
  .sum button { min-height: 34px; padding: 4px 10px; font-size: 13px; }
  .qty { display: flex; gap: 8px; align-items: center; }
  .qty button { width: 56px; font-size: 22px; font-weight: 700; }
  .qty input { text-align: center; font-size: 22px; font-weight: 700; }
  .reasons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .reasons .span2 { grid-column: span 2; }
  .reasons button[aria-pressed=true] { background: var(--accent-soft); border: 2px solid var(--accent); font-weight: 700; }
  .msg { border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-weight: 600; }
  .msg.ok { background: var(--good-soft); color: var(--good); }
  .msg.err { background: var(--bad-soft); color: var(--bad); }
  .msg.info { background: var(--mute-soft); color: var(--sub); }
  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { border-top: 1px solid var(--line); padding: 10px 0; display: flex; gap: 10px; align-items: flex-start; }
  .hist li:first-child { border-top: 0; }
  .hist .main { flex: 1; min-width: 0; }
  .hist .item { font-weight: 600; word-break: break-all; }
  .hist .meta { font-size: 13px; color: var(--sub); }
  .chip { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; white-space: nowrap; display: inline-block; }
  .chip.s-未反映 { background: var(--warn-soft); color: var(--warn); }
  .chip.s-処理中 { background: var(--warn-soft); color: var(--warn); }
  .chip.s-反映済 { background: var(--good-soft); color: var(--good); }
  .chip.s-要確認 { background: var(--bad-soft); color: var(--bad); }
  .chip.s-取消 { background: var(--mute-soft); color: var(--sub); }
  .hist .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .hist .side button { min-height: 34px; padding: 4px 10px; font-size: 13px; }
  .foot { font-size: 12px; color: var(--sub); text-align: center; margin-top: 8px; }
  .foot button { min-height: 32px; padding: 4px 10px; font-size: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>持ち出し登録</h1>
  <div id="msg" class="msg hidden" role="status" aria-live="polite"></div>

  <section class="card">
    <label class="label" for="name">名前</label>
    <input id="name" type="text" maxlength="30" placeholder="例：内間" autocomplete="name">
  </section>

  <section class="card">
    <span class="label">1. 商品を入れる</span>
    <div id="pickArea">
      <button id="scanBtn" class="scan primary" type="button">📷 バーコードを読む</button>
      <div id="reader" class="hidden"></div>
      <button id="stopScan" class="wide hidden" type="button" style="margin-bottom:10px">カメラを閉じる</button>
      <input id="search" type="search" placeholder="品名コード・品名・JANで検索" autocomplete="off">
      <ul id="results" class="results"></ul>
    </div>
    <div class="meta" style="font-size:13px;color:var(--sub);margin-top:8px">読んだ商品は下のカゴに入ります。同じ商品をもう一度読むと1つ増えます。</div>
  </section>

  <section class="card">
    <span class="label">2. カゴ（数量を確かめる）</span>
    <ul id="cart" class="cart"></ul>
    <div id="cartEmpty" style="color:var(--sub);font-size:14px">まだ入っていません。バーコードを読むか、検索して選んでください。</div>
    <div id="sum" class="sum hidden"><span id="sumText"></span><button id="clearCart" type="button">カゴを空にする</button></div>
  </section>

  <section class="card">
    <span class="label">3. 理由</span>
    <div class="reasons" id="reasons">
      <button type="button" aria-pressed="false">サンプル</button>
      <button type="button" aria-pressed="false">社内使用</button>
      <button type="button" aria-pressed="false">破損・不良</button>
      <button type="button" aria-pressed="false">展示会・イベント</button>
      <button type="button" aria-pressed="false">オンラインショップ</button>
      <button type="button" aria-pressed="false">提供品</button>
      <button type="button" aria-pressed="false">海外用</button>
      <button type="button" aria-pressed="false">その他</button>
    </div>
    <div id="detailBox" class="hidden" style="margin-top:10px">
      <label class="label" for="detail">「その他」の内容（必須）</label>
      <input id="detail" type="text" maxlength="40" placeholder="例：撮影用、修理見本 など" autocomplete="off">
    </div>
  </section>

  <button id="send" class="primary wide" type="button" disabled style="font-size:18px;min-height:54px;margin-bottom:12px">まとめて登録する</button>

  <section class="card">
    <span class="label">自分の最近の登録</span>
    <ul id="hist" class="hist"></ul>
    <div id="histEmpty" class="meta" style="color:var(--sub);font-size:14px">まだ登録はありません</div>
  </section>

  <div class="foot">
    <span id="itemsInfo">商品一覧：読み込み中…</span>
    <button id="reload" type="button">更新</button>
    <div id="syncInfo"></div>
  </div>
</main>

<script>
/* ===== 設定 ===== */
const API = 'https://script.google.com/macros/s/AKfycbxuvD7IU084MpKMTFr5X1MSkcm9ctc341wR8E-8oUJy_YKfjNFfufymVV059cZScbsl/exec';
const TOKEN = 'uPFkvADv6Ft3wAI5l8QVCoPs';
const MAX_QTY = 100;
const MAX_ITEMS = 50;

/* ===== 状態 ===== */
let items = [];          // [code, jan, name]
let byJan = new Map();
let cart = [];           // [{code, jan, name, qty, cid}]
let reason = '';
const OTHER = 'その他';
const detailText = () => $('detail').value.replace(/\s+/g, ' ').trim();
const reasonLabel = () => reason === OTHER ? OTHER + '：' + detailText() : reason;
let clientId = newId();
let scanner = null;
let sending = false;

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}
const norm = s => String(s || '').normalize('NFKC').toUpperCase().replace(/\s+/g, '');

function showMsg(text, kind, stay) {
  const m = $('msg');
  m.textContent = text;
  m.className = 'msg ' + (kind || 'info');
  clearTimeout(showMsg.t);
  if (kind === 'ok') showMsg.t = setTimeout(() => m.classList.add('hidden'), 4000);
  if (kind !== 'info' && !stay) window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function api(body) {
  if (!/^https:\/\//.test(API)) throw new Error('ページの設定（GASのURL）がまだです');
  const res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ token: TOKEN }, body)) });
  if (!res.ok) throw new Error('通信エラー（' + res.status + '）');
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'エラーが発生しました');
  return data;
}

/* ===== 商品一覧 ===== */
function setSync(t) {
  if (!t) { $('syncInfo').textContent = ''; return; }
  const ageMin = (Date.now() - new Date(t.replace(/\//g, '-').replace(' ', 'T') + '+09:00').getTime()) / 60000;
  $('syncInfo').textContent = '在庫への反映：最終 ' + t.slice(5, 16) + (ageMin > 30 ? '（POSのPCが止まっているかもしれません）' : '');
  $('syncInfo').style.color = ageMin > 30 ? 'var(--bad)' : '';
}
function setItems(list, updated) {
  items = list || [];
  byJan = new Map();
  items.forEach(it => {
    if (!it[1]) return;
    const k = String(it[1]).replace(/\D/g, '');
    if (!byJan.has(k)) byJan.set(k, []);
    byJan.get(k).push(it);
  });
  $('itemsInfo').textContent = '商品一覧：' + items.length + '件' + (updated ? '（' + updated + ' 更新）' : '');
}
async function loadItems(force) {
  const cached = store.get('items');
  if (cached && !force) {
    try { const c = JSON.parse(cached); setItems(c.items, c.updated); } catch (e) {}
  }
  try {
    const d = await api({ action: 'products' });
    setItems(d.items, d.updated);
    setSync(d.lastSync);
    store.set('items', JSON.stringify({ items: d.items, updated: d.updated }));
    if (force) showMsg('商品一覧を更新しました', 'ok');
  } catch (e) {
    if (!items.length) $('itemsInfo').textContent = '商品一覧を読み込めません：' + e.message;
    if (force) showMsg(e.message, 'err');
  }
}

/* ===== 商品を選ぶ ===== */
function renderResults() {
  const q = norm($('search').value);
  const ul = $('results');
  ul.innerHTML = '';
  if (!q) return;
  const hits = [];
  for (const it of items) {
    if (norm(it[0]).includes(q) || norm(it[2]).includes(q) || String(it[1]).includes(q)) hits.push(it);
    if (hits.length >= 30) break;
  }
  if (!hits.length) {
    const li = document.createElement('li');
    li.textContent = '見つかりません';
    li.style.cursor = 'default';
    li.style.color = 'var(--sub)';
    ul.appendChild(li);
    return;
  }
  showChoices(hits);
}
function showChoices(hits) {
  const ul = $('results');
  ul.innerHTML = '';
  hits.forEach(it => {
    const li = document.createElement('li');
    const n = document.createElement('div'); n.textContent = it[0] + '　' + it[2];
    const c = document.createElement('div'); c.className = 'code'; c.textContent = it[1] ? 'JAN ' + it[1] : '';
    li.append(n, c);
    li.addEventListener('click', () => pick(it));
    ul.appendChild(li);
  });
}
/* ===== カゴ ===== */
function saveCart() { store.set('cart', JSON.stringify(cart)); }
function loadCart() {
  try { const c = JSON.parse(store.get('cart') || '[]'); if (Array.isArray(c)) cart = c.filter(x => x && x.code && x.cid); } catch (e) { cart = []; }
}
function pick(it) {
  let x = cart.find(c => c.code === it[0]);
  if (x) x.qty = Math.min(MAX_QTY, x.qty + 1);
  else {
    if (cart.length >= MAX_ITEMS) { showMsg('一度に登録できるのは' + MAX_ITEMS + '種類までです。いったん登録してください', 'err'); return; }
    x = { code: it[0], jan: it[1] || '', name: it[2], qty: 1, cid: newId() };
    cart.unshift(x);
  }
  $('search').value = '';
  $('results').innerHTML = '';
  saveCart(); renderCart(x.code);
  showMsg('カゴに入れました：' + x.name + '（' + x.qty + '個）', 'ok', true);
}
function setItemQty(code, n) {
  const x = cart.find(c => c.code === code); if (!x) return;
  n = Math.round(Number(n));
  x.qty = Math.max(1, Math.min(MAX_QTY, Number.isFinite(n) ? n : 1));
  saveCart(); renderCart();
}
function removeItem(code) { cart = cart.filter(c => c.code !== code); saveCart(); renderCart(); }
function renderCart(flash) {
  const ul = $('cart');
  ul.innerHTML = '';
  cart.forEach(x => {
    const li = document.createElement('li');
    if (x.code === flash) li.className = 'flash';
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = x.name;
    const cd = document.createElement('div'); cd.className = 'code'; cd.textContent = x.code + (x.jan ? '　JAN ' + x.jan : '');
    const ctl = document.createElement('div'); ctl.className = 'ctl';
    const mi = document.createElement('button'); mi.type = 'button'; mi.textContent = '−'; mi.setAttribute('aria-label', x.name + ' を1つ減らす');
    const q = document.createElement('input'); q.type = 'number'; q.inputMode = 'numeric'; q.min = 1; q.max = MAX_QTY; q.value = x.qty; q.setAttribute('aria-label', x.name + ' の数量');
    const pl = document.createElement('button'); pl.type = 'button'; pl.textContent = '＋'; pl.setAttribute('aria-label', x.name + ' を1つ増やす');
    const del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = '削除';
    mi.addEventListener('click', () => setItemQty(x.code, x.qty - 1));
    pl.addEventListener('click', () => setItemQty(x.code, x.qty + 1));
    q.addEventListener('change', () => setItemQty(x.code, q.value));
    del.addEventListener('click', () => removeItem(x.code));
    ctl.append(mi, q, pl, del);
    li.append(nm, cd, ctl);
    ul.appendChild(li);
  });
  const total = cart.reduce((a, x) => a + x.qty, 0);
  $('cartEmpty').classList.toggle('hidden', cart.length > 0);
  $('sum').classList.toggle('hidden', cart.length === 0);
  $('sumText').textContent = cart.length + '種類・合計 ' + total + '個';
  $('send').textContent = cart.length ? 'まとめて登録する（' + cart.length + '種類・' + total + '個）' : 'まとめて登録する';
  updateSend();
}

/* ===== バーコード ===== */
function loadScanLib() {
  if (window.Html5Qrcode) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('読み取り機能を読み込めませんでした'));
    document.head.appendChild(s);
  });
}
async function startScan() {
  try {
    await loadScanLib();
    $('reader').classList.remove('hidden');
    $('stopScan').classList.remove('hidden');
    $('scanBtn').classList.add('hidden');
    const F = window.Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode('reader', { formatsToSupport: [F.EAN_13, F.EAN_8, F.CODE_128, F.UPC_A], verbose: false });
    let last = '', lastAt = 0;
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, h) => ({ width: Math.min(w * 0.9, 320), height: 120 }) },
      text => {
        const jan = String(text).replace(/\D/g, '');
        if (jan === last && Date.now() - lastAt < 2500) return;   // 同じバーコードの読み続けを防ぐ
        last = jan; lastAt = Date.now();
        const hits = byJan.get(jan) || [];
        if (hits.length === 1) {
          if (navigator.vibrate) navigator.vibrate(80);
          pick(hits[0]);
        } else if (hits.length > 1) {
          if (navigator.vibrate) navigator.vibrate(80);
          stopScan();
          showChoices(hits);
          showMsg('同じバーコードの商品が' + hits.length + 'つあります。品番を確かめて選んでください', 'err');
        } else {
          showMsg('このバーコードは商品一覧にありません：' + text + '（品名で検索してください）', 'err');
        }
      }, () => {});
  } catch (e) {
    stopScan();
    showMsg('カメラが使えません。品名コードや品名で検索してください。（' + (e && e.message ? e.message : e) + '）', 'err');
  }
}
async function stopScan() {
  const s = scanner;
  scanner = null;
  if (s) { try { await s.stop(); } catch (e) {} try { s.clear(); } catch (e) {} }
  $('reader').classList.add('hidden');
  $('stopScan').classList.add('hidden');
  $('scanBtn').classList.remove('hidden');
}

/* ===== 理由・送信ボタン ===== */
function updateSend() {
  $('send').disabled = sending || !cart.length || !reason || (reason === OTHER && !detailText()) || !$('name').value.trim();
}

/* ===== 登録 ===== */
async function send() {
  const name = $('name').value.trim();
  if (!name) { showMsg('名前を入力してください', 'err'); return; }
  if (!cart.length || !reason) return;
  if (reason === OTHER && !detailText()) { showMsg('「その他」の内容を入力してください', 'err'); return; }
  const label = reasonLabel();
  const total = cart.reduce((a, x) => a + x.qty, 0);
  const lines = cart.slice(0, 12).map(x => '・' + x.name + '　' + x.qty + '個');
  if (cart.length > 12) lines.push('・ほか ' + (cart.length - 12) + '種類');
  if (!confirm('理由：' + label + '\n' + cart.length + '種類・合計 ' + total + '個を登録しますか？\n\n' + lines.join('\n'))) return;
  sending = true; updateSend();
  $('send').textContent = '送信中…';
  try {
    await api({ action: 'submitMany', name, reason, detail: reason === OTHER ? detailText() : '',
                items: cart.map(x => ({ code: x.code, qty: x.qty, clientId: x.cid })) });
    showMsg('登録しました：' + cart.length + '種類・合計 ' + total + '個（' + label + '）', 'ok');
    cart = []; saveCart();
    reason = '';
    $('detail').value = '';
    $('detailBox').classList.add('hidden');
    document.querySelectorAll('#reasons button').forEach(b => b.setAttribute('aria-pressed', 'false'));
    loadHist();
  } catch (e) {
    showMsg('登録できませんでした：' + e.message + '（カゴはそのままです。もう一度「まとめて登録する」を押してください）', 'err');
  } finally {
    sending = false;
    renderCart();
  }
}

/* ===== 履歴 ===== */
async function loadHist() {
  const name = $('name').value.trim();
  if (!name || !/^https:\/\//.test(API)) return;
  try {
    const d = await api({ action: 'recent', name });
    const ul = $('hist');
    ul.innerHTML = '';
    $('histEmpty').classList.toggle('hidden', d.rows.length > 0);
    d.rows.forEach(r => {
      const li = document.createElement('li');
      const main = document.createElement('div'); main.className = 'main';
      const it = document.createElement('div'); it.className = 'item'; it.textContent = r.item + '　' + r.qty + '個';
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = r.time.slice(5, 16) + '　' + r.reason + (r.memo ? '　' + r.memo : '');
      main.append(it, meta);
      const side = document.createElement('div'); side.className = 'side';
      const chip = document.createElement('span'); chip.className = 'chip s-' + r.status; chip.textContent = r.status;
      side.appendChild(chip);
      if (r.status === '未反映') {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = '取り消す';
        b.addEventListener('click', () => cancel(r));
        side.appendChild(b);
      }
      li.append(main, side);
      ul.appendChild(li);
    });
  } catch (e) { /* 履歴は表示できなくても登録はできる */ }
}
async function cancel(r) {
  if (!confirm(r.item + ' ' + r.qty + '個の登録を取り消しますか？')) return;
  try {
    await api({ action: 'cancel', id: r.id, name: $('name').value.trim() });
    showMsg('取り消しました', 'ok');
  } catch (e) {
    showMsg(e.message, 'err');
  }
  loadHist();
}

/* ===== 画面の動き ===== */
$('name').value = store.get('name') || '';
$('name').addEventListener('input', updateSend);
$('name').addEventListener('change', () => { store.set('name', $('name').value.trim()); loadHist(); });
$('search').addEventListener('input', renderResults);
$('scanBtn').addEventListener('click', startScan);
$('stopScan').addEventListener('click', stopScan);
$('clearCart').addEventListener('click', () => { if (confirm('カゴを空にしますか？')) { cart = []; saveCart(); renderCart(); } });
document.querySelectorAll('#reasons button').forEach(b => b.addEventListener('click', () => {
  reason = b.textContent;
  document.querySelectorAll('#reasons button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  $('detailBox').classList.toggle('hidden', reason !== OTHER);
  if (reason === OTHER) $('detail').focus();
  updateSend();
}));
$('detail').addEventListener('input', updateSend);
$('send').addEventListener('click', send);
$('reload').addEventListener('click', () => { loadItems(true); loadHist(); });
setInterval(() => { if (document.visibilityState === 'visible') loadHist(); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadHist(); });

if (!/^https:\/\//.test(API)) showMsg('このページの設定（GASのURL）がまだです。管理者に連絡してください。', 'err');
loadCart();
renderCart();
loadItems(false);
loadHist();
</script>
