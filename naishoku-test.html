<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>内職伝票 動作確認版</title>
<style>
:root{
  --bg:#F1F3EF; --card:#FFFFFF; --ink:#161D26; --ink2:#3A4552; --muted:#68727E;
  --line:#D8DDD5; --ai:#27548A; --ai-soft:#E5ECF5; --shu:#A63C38; --midori:#356F53;
  --sans:"Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP",system-ui,sans-serif;
  --mincho:"Yu Mincho","YuMincho","Hiragino Mincho ProN","MS Mincho",serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);overflow-x:hidden}
body{font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}

/* ---------- app chrome ---------- */
.app{max-width:640px;margin:0 auto;padding:0 12px 96px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:10px 12px 8px;margin:0 -12px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em;display:flex;
  align-items:center;gap:8px}
.top h1 .tag{font-size:10px;font-weight:700;letter-spacing:.08em;color:#fff;background:var(--ai);
  padding:2px 7px;border-radius:3px}
.steps{display:flex;gap:4px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
  padding:5px 11px;border-radius:14px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.steps button.on{background:var(--ai);border-color:var(--ai);color:#fff;font-weight:700}
.steps button:disabled{opacity:.4;cursor:not-allowed}

section.pane{display:none;padding-top:14px}
section.pane.on{display:block}
h2.st{margin:0 0 4px;font-size:17px;font-weight:700}
p.sub{margin:0 0 14px;font-size:13px;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:700}
input[type=text],input[type=number],input[type=date],input[type=search]{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--card);
  color:var(--ink);font-size:16px}      /* 16px 未満だと iOS が勝手にズームする */
input:focus{outline:2px solid var(--ai);outline-offset:1px;border-color:var(--ai)}

.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.btn{flex:1 1 auto;min-width:120px;padding:12px 16px;border-radius:8px;border:1px solid var(--ai);
  background:var(--ai);color:#fff;font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:var(--card);color:var(--ai)}
.btn.quiet{background:var(--card);color:var(--muted);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.list{max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.item{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:11px 13px;
  border:0;border-bottom:1px solid var(--line);background:var(--card);cursor:pointer}
.item:last-child{border-bottom:0}
.item:active{background:var(--ai-soft)}
.item .c{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ai);flex:0 0 84px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n{flex:1 1 auto;font-size:14px;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.item .p{flex:0 0 auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.item.sel{background:var(--ai-soft)}
.empty{padding:22px 14px;color:var(--muted);font-size:13.5px;text-align:center}

.pill{display:inline-flex;gap:6px;align-items:center;background:var(--ai-soft);color:var(--ai);
  border-radius:20px;padding:5px 13px;font-size:13px;font-weight:700;margin-bottom:12px}
.seg{display:flex;gap:0;margin-bottom:10px;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);color:var(--muted);padding:8px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--ai);color:#fff;font-weight:700}

/* cart */
table.cart{width:100%;border-collapse:collapse;font-size:13.5px}
table.cart th{font-size:11.5px;color:var(--muted);text-align:left;padding:8px 10px;
  border-bottom:1px solid var(--line);font-weight:700}
table.cart td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.cart tr:last-child td{border-bottom:0}
table.cart .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.cart .cd{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--ai)}
table.cart input{width:74px;padding:6px 8px;text-align:right;font-size:16px}
.del{border:0;background:none;color:var(--shu);font-size:18px;cursor:pointer;padding:2px 6px;line-height:1}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:12px 13px;
  background:var(--ai-soft);font-weight:700}
.sum .v{font-size:19px;font-variant-numeric:tabular-nums}

.note{font-size:12.5px;color:var(--muted);line-height:1.75;margin:10px 0 0}
.warn{background:#FBEDEC;border-left:3px solid var(--shu);padding:11px 13px;border-radius:0 6px 6px 0;
  font-size:13px;color:var(--ink2);margin:12px 0}
.ok{background:#E4EFE9;border-left:3px solid var(--midori);padding:11px 13px;border-radius:0 6px 6px 0;
  font-size:13px;color:var(--ink2);margin:12px 0}

/* ---------- 帳票プレビュー ---------- */
.scaler{overflow:hidden;margin:12px auto;width:max-content;max-width:100%}
.sheet{width:297mm;min-height:210mm;padding:14mm 16mm;background:#fff;transform-origin:top left;
  box-shadow:0 2px 14px rgba(0,0,0,.18);page-break-after:always;color:#000;
  font-family:"Yu Gothic","YuGothic","Hiragino Sans","MS PGothic",sans-serif;font-size:14px;line-height:1.7}
.sheet:last-child{page-break-after:auto}
.doc-title{text-align:center;margin:0 0 2mm}
.doc-title span{font-family:var(--mincho);font-size:26px;font-weight:700;letter-spacing:.28em;
  border-bottom:1.5px solid #000;padding:0 10px 3px;display:inline-block;text-indent:.28em}
.issuer{text-align:right;line-height:1.7;font-size:13px;margin-bottom:8mm}
.issuer .addr,.issuer .corp{font-weight:700}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 28px;margin:0 0 7mm 6mm;line-height:1.9}
.meta dt{color:#666;font-size:13px}
.meta dd{margin:0}
.addressee{display:flex;align-items:flex-start;gap:26px;margin:0 0 6mm 4mm}
.addressee .nm{font-size:19px;line-height:1.5;white-space:nowrap}
.addressee .ct{font-size:13px;line-height:1.65;padding-top:3px}
.sheet table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
.sheet thead th{font-weight:400;color:#666;font-size:12.5px;padding:0 8px 3px;text-align:left;white-space:nowrap}
.sheet thead tr:last-child th{border-bottom:1px solid #9a9a9a}
.sheet tbody td{padding:5px 8px;vertical-align:baseline;overflow-wrap:anywhere}
.sheet .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet .cd{white-space:nowrap}
.sheet .total-rule td{border-top:1px solid #9a9a9a}
.total{margin-top:2mm;display:flex;justify-content:flex-end}
.total .box{display:flex;gap:26px;font-weight:700;font-size:15px;padding:3px 8px 4px;
  border-top:1.2px solid #333;border-bottom:2.4px double #333}
.total .amt{font-variant-numeric:tabular-nums;min-width:88px;text-align:right}
.two-line tbody tr.r1 td{padding-bottom:0}
.two-line tbody tr.r2 td{padding-top:1px;padding-bottom:9px}
.two-line tbody tr.r2 td.pn{padding-left:24px}

#scanwrap{display:none;margin:10px 0}
#scanvid{width:100%;max-height:46vh;background:#000;border-radius:8px;object-fit:cover}

@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff;overflow:visible}
  .app{max-width:none;padding:0}
  section.pane{padding-top:0}      /* この 14px が用紙を2ページ目に押し出していた */
  header.top,.steps,.rowbtns,.noprint,section.pane:not(.on){display:none!important}
  section.pane.on > *:not(.printarea){display:none!important}
  .printarea{width:auto!important;margin-left:0!important}
  .scaler{overflow:visible!important;margin:0;width:auto!important;height:auto!important;max-width:none}
  /* 画面では A4 の形を見せるため min-height を入れているが、印刷では
     ちょうど1ページ分の高さになり、わずかな端数で2ページ目が出る。
     印刷時は高さを内容なりにして、収まる限り1ページに収める。 */
  .sheet{transform:none!important;box-shadow:none;margin:0;
         min-height:0!important;height:auto!important;page-break-after:auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

<header class="top noprint">
  <h1>内職伝票 <span class="tag">動作確認版</span></h1>
  <div class="steps">
    <button id="t0" onclick="go(0)">① 内職者</button>
    <button id="t1" onclick="go(1)">② 品目</button>
    <button id="t2" onclick="go(2)">③ 委託伝票</button>
    <button id="t3" onclick="go(3)">④ 納入・受領書</button>
  </div>
</header>

<!-- ① 内職者 -->
<section class="pane" id="p0">
  <h2 class="st">内職者を選ぶ</h2>
  <p class="sub">Access の内職者名簿から読み込んでいます。</p>
  <div class="seg">
    <button id="sg1" class="on" onclick="setScope(1)">稼働中のみ</button>
    <button id="sg0" onclick="setScope(0)">全員</button>
  </div>
  <label class="field"><span>氏名・コードで絞り込み</span>
    <input type="search" id="wq" placeholder="例：アイマックス／A00051" oninput="drawWorkers()"></label>
  <div class="card"><div class="list" id="wlist"></div></div>
</section>

<!-- ② 品目 -->
<section class="pane" id="p1">
  <h2 class="st">品目を追加する</h2>
  <p class="sub" id="whoLabel"></p>

  <label class="field"><span>商品コード・商品名・JANで検索</span>
    <input type="search" id="pq" placeholder="例：ネコチューブ／Z3860E／4521764…" oninput="drawProducts()"></label>
  <div class="rowbtns" style="margin-top:-4px">
    <button class="btn ghost" id="scanBtn" onclick="toggleScan()">カメラでJANを読む</button>
  </div>
  <div id="scanwrap"><video id="scanvid" playsinline muted></video>
    <p class="note" id="scanmsg"></p></div>

  <div class="card"><div class="list" id="plist"></div></div>

  <h2 class="st" style="margin-top:22px">カート</h2>
  <div class="card">
    <table class="cart"><thead><tr>
      <th style="width:34%">品目</th><th class="num">単価</th><th class="num" style="width:88px">数量</th>
      <th class="num">金額</th><th style="width:34px"></th></tr></thead>
      <tbody id="cart"></tbody></table>
    <div class="sum"><span>計</span><span class="v" id="cartSum">¥0</span></div>
  </div>
  <div class="rowbtns">
    <button class="btn" id="toSlip" onclick="go(2)" disabled>委託伝票をつくる</button>
  </div>
</section>

<!-- ③ 委託伝票 -->
<section class="pane" id="p2">
  <h2 class="st">委託伝票</h2>
  <p class="sub">内容を確認して、PDFにするか共有してください。</p>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <label class="field"><span>伝票番号</span><input type="number" id="slipNo" oninput="renderItaku()"></label>
    <label class="field"><span>引渡日</span><input type="date" id="hikiwatasi" oninput="renderItaku()"></label>
  </div>
  <div class="rowbtns noprint">
    <button class="btn" onclick="window.print()">印刷 / PDFにする</button>
    <button class="btn ghost" onclick="shareSheet('itaku')">PDFにしてLINEで送る</button>
    <button class="btn quiet" id="zoom2" onclick="toggleZoom()">原寸で見る</button>
  </div>
  <div class="printarea" id="itakuOut"></div>
  <p class="note noprint">「PDFにしてLINEで送る」で、この用紙をPDFにして共有シートを開きます。PDFは画面を開いた時点で裏で作っているので、押した瞬間に共有できます。うまくいかない端末では、PDFを保存してから手で送る形になります。</p>
</section>

<!-- ④ 納入・受領書 -->
<section class="pane" id="p3">
  <h2 class="st">納入を登録して受領書を出す</h2>
  <p class="sub">委託した数量に対して、実際に納まった数を入れてください。分納もそのまま扱えます。</p>
  <div class="card">
    <table class="cart"><thead><tr>
      <th style="width:36%">品目</th><th class="num">委託</th><th class="num">既納</th>
      <th class="num" style="width:88px">今回納入</th><th class="num">金額</th></tr></thead>
      <tbody id="deliv"></tbody></table>
    <div class="sum"><span>お支払予定金額</span><span class="v" id="delivSum">¥0</span></div>
  </div>
  <label class="field" style="margin-top:12px"><span>受領日</span><input type="date" id="jryDate" oninput="renderJuryo()"></label>
  <div class="rowbtns noprint">
    <button class="btn" onclick="window.print()">印刷 / PDFにする</button>
    <button class="btn ghost" onclick="shareSheet('juryo')">PDFにしてLINEで送る</button>
    <button class="btn quiet" onclick="commitDelivery()">この納入を確定して残数に反映</button>
  </div>
  <div class="printarea" id="juryoOut"></div>
</section>

</div>

/* ---------- 画面遷移 ---------- */
function go(i){
  if(i>=1 && !S.worker) return;
  if(i>=2 && S.cart.length===0) return;
  S.step=i;
  for(let k=0;k<4;k++){
    document.getElementById("p"+k).classList.toggle("on",k===i);
    document.getElementById("t"+k).classList.toggle("on",k===i);
  }
  document.getElementById("t1").disabled=!S.worker;
  document.getElementById("t2").disabled=S.cart.length===0;
  document.getElementById("t3").disabled=S.cart.length===0;
  if(i===2) renderItaku();
  if(i===3){ drawDelivery(); renderJuryo(); }
  scrollTo(0,0);
}

/* ---------- ① 内職者 ---------- */
function setScope(v){ S.scope=v;
  document.getElementById("sg1").classList.toggle("on",v===1);
  document.getElementById("sg0").classList.toggle("on",v===0);
  drawWorkers(); }

function drawWorkers(){
  const q=skey(document.getElementById("wq").value);
  let ws=WORKERS.filter((w,i)=>(S.scope===0||w[4]===1)&&(!q||WIDX[i].includes(q)));
  document.getElementById("wlist").innerHTML = ws.length? ws.map(w=>
    `<button class="item ${S.worker&&S.worker[0]===w[0]?"sel":""}" onclick="pickWorker('${w[0]}')">
       <span class="c">${esc(w[0])}</span><span class="n">${esc(w[1])}</span>
       <span class="p">${w[4]?"稼働中":"休止"}</span></button>`).join("")
    : `<div class="empty">該当する内職者がいません</div>`;
}
function pickWorker(code){
  S.worker=WORKERS.find(w=>w[0]===code);
  document.getElementById("whoLabel").innerHTML=
    `<span class="pill">${esc(S.worker[1])} 様</span>`;
  drawWorkers(); go(1);
}

/* ---------- ② 品目 ---------- */
function drawProducts(){
  const raw=document.getElementById("pq").value.trim();
  const box=document.getElementById("plist");
  if(!raw){ box.innerHTML=`<div class="empty">商品コード・商品名・JANのどれかで検索してください<br>（マスタ ${n(PRODUCTS.length)} 件）</div>`; return; }
  const q=skey(raw);
  const hit=[];
  for(let i=0;i<PIDX.length && hit.length<60;i++) if(PIDX[i].includes(q)) hit.push(i);
  box.innerHTML = hit.length? hit.map(i=>{
    const p=PRODUCTS[i];
    return `<button class="item" onclick="addItem(${i})">
      <span class="c">${esc(p[0])}</span>
      <span class="n">${esc(p[1]||"（商品名が未登録）")}</span>
      <span class="p">${p[2]==null?"単価なし":"¥"+p[2]}</span></button>`;
  }).join("") : `<div class="empty">見つかりません。<br>マスタに無い作業の可能性があります。</div>`;
}
function addItem(i){
  const p=PRODUCTS[i];
  const ex=S.cart.find(c=>c.code===p[0]);
  if(ex){ ex.qty+=1; } else { S.cart.push({code:p[0],name:p[1]||"",price:p[2]??0,qty:1}); }
  document.getElementById("pq").value=""; drawProducts(); drawCart();
}
function drawCart(){
  const b=document.getElementById("cart");
  b.innerHTML = S.cart.length? S.cart.map((c,i)=>`<tr>
      <td><div class="cd">${esc(c.code)}</div>${esc(c.name)}</td>
      <td class="num">${tankaJ(c.price)}</td>
      <td class="num"><input type="number" min="0" step="1" value="${c.qty}"
          onchange="S.cart[${i}].qty=Math.max(0,Number(this.value)||0);drawCart()"></td>
      <td class="num">${yen(c.qty*c.price)}</td>
      <td><button class="del" onclick="S.cart.splice(${i},1);drawCart()" aria-label="削除">×</button></td>
    </tr>`).join("") : `<tr><td colspan="5"><div class="empty">まだ何も入っていません</div></td></tr>`;
  document.getElementById("cartSum").textContent=yen(S.cart.reduce((a,c)=>a+c.qty*c.price,0));
  const has=S.cart.length>0;
  document.getElementById("toSlip").disabled=!has;
  document.getElementById("t2").disabled=!has;
  document.getElementById("t3").disabled=!has;
}

/* ---------- 外部ライブラリの読み込み ----------
   1つのCDNに賭けると、そこが落ちた／パスが変わっただけで機能ごと死ぬ。
   複数の候補を順に試し、どれが使えたかを画面に出して切り分けられるようにする。 */
const LIBS={
  zxing:{global:"ZXing",urls:[
    "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js",
    "https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/zxing-library/0.21.3/umd/index.min.js"]},
  html2canvas:{global:"html2canvas",urls:[
    "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"]},
  jspdf:{global:"jspdf",urls:[
    "https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"]}
};
const _libCache={};
function loadScript(src){return new Promise((ok,ng)=>{
  const s=document.createElement("script"); s.src=src; s.async=true;
  s.onload=()=>ok(); s.onerror=()=>ng(new Error("読み込み失敗")); document.head.appendChild(s);});}
function loadLib(name){
  if(_libCache[name]) return _libCache[name];
  const L=LIBS[name];
  _libCache[name]=(async()=>{
    if(window[L.global]) return true;
    for(const u of L.urls){
      try{ await loadScript(u); if(window[L.global]) return true; }catch(e){}
    }
    return false;
  })();
  return _libCache[name];
}

/* ---------- JANスキャン ---------- */
let reader=null, camStream=null, detectTimer=null;
const scanMsg=t=>{document.getElementById("scanmsg").textContent=t;};

async function toggleScan(){
  const wrap=document.getElementById("scanwrap");
  if(wrap.style.display==="block"){ stopScan(); return; }
  wrap.style.display="block";
  document.getElementById("scanBtn").textContent="スキャンをやめる";

  if(!navigator.mediaDevices?.getUserMedia){
    scanMsg("このブラウザはカメラに対応していません。JANを検索欄に入力してください。"); return; }
  if(!(location.protocol==="https:"||location.hostname==="localhost")){
    scanMsg("カメラは https で開いたときだけ使えます（いまは "+location.protocol+"）。"); return; }

  const vid=document.getElementById("scanvid");
  try{
    scanMsg("カメラの使用を許可してください…");
    // 背面カメラを優先。指定が通らない端末では既定のカメラにフォールバック。
    try{
      camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:"environment"}},audio:false});
    }catch(e){
      camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    }
    vid.srcObject=camStream; vid.setAttribute("playsinline",""); vid.muted=true;
    await vid.play();
  }catch(e){
    scanMsg("カメラを起動できませんでした（"+e.name+"："+e.message+"）。"
      +(e.name==="NotAllowedError"?" ブラウザの設定でこのサイトのカメラを許可してください。":""));
    return;
  }

  const hit=code=>{ document.getElementById("pq").value=code; drawProducts(); stopScan();
    scanMsg("読み取りました："+code); };

  // ① ブラウザ内蔵の検出器（Android Chrome など）。ライブラリ不要で一番速い。
  if("BarcodeDetector" in window){
    try{
      const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"]});
      scanMsg("バーコードをカメラに向けてください。（内蔵の読み取り機能を使用）");
      detectTimer=setInterval(async()=>{
        try{ const r=await det.detect(vid); if(r&&r.length) hit(r[0].rawValue); }catch(e){}
      },350);
      return;
    }catch(e){ /* 対応形式がない場合は下へ */ }
  }

  // ② ZXing を読み込んで使う（iPhone はこちら）
  scanMsg("読み取り機能を準備しています…");
  const ok=await loadLib("zxing");
  if(!ok){ scanMsg("読み取り用ライブラリを読み込めませんでした。通信環境をご確認いただくか、JANを検索欄に入力してください。"); return; }
  try{
    reader=new ZXing.BrowserMultiFormatReader();
    reader.decodeFromStream(camStream,vid,(res)=>{ if(res) hit(res.getText()); });
    scanMsg("バーコードをカメラに向けてください。");
  }catch(e){ scanMsg("読み取りを開始できませんでした："+e.message); }
}

function stopScan(){
  if(detectTimer){ clearInterval(detectTimer); detectTimer=null; }
  try{ reader&&reader.reset(); }catch(e){}
  reader=null;
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  const v=document.getElementById("scanvid"); if(v) v.srcObject=null;
  document.getElementById("scanwrap").style.display="none";
  document.getElementById("scanBtn").textContent="カメラでJANを読む";
}

function schedulePdf(kind){
  clearTimeout(_pdfTimer[kind]);

/* ---------- ④ 納入・受領書 ---------- */
function drawDelivery(){
  const b=document.getElementById("deliv");
  b.innerHTML=S.cart.map((c,i)=>{
    const done=S.delivered[c.code]||0, rest=Math.max(0,c.qty-done);
    return `<tr>
      <td><div class="cd">${esc(c.code)}</div>${esc(c.name)}</td>
      <td class="num">${n(c.qty)}</td><td class="num">${n(done)}</td>
      <td class="num"><input type="number" min="0" max="${rest}" step="1" id="dq${i}"
          value="${rest}" onchange="renderJuryo()"></td>
      <td class="num" id="da${i}">${yen(rest*c.price)}</td></tr>`;}).join("");
}
function delivRows(){
  return S.cart.map((c,i)=>{
    const el=document.getElementById("dq"+i);
    return {...c, qty:el?Math.max(0,Number(el.value)||0):0};
  }).filter(r=>r.qty>0);
}
function renderJuryo(){
  const date=document.getElementById("jryDate").value||iso(new Date());
  const no=document.getElementById("slipNo").value||NEXT_NO;
  const rows=delivRows(); let sum=0;
  S.cart.forEach((c,i)=>{const el=document.getElementById("dq"+i);
    const a=document.getElementById("da"+i);
    if(el&&a) a.textContent=yen((Number(el.value)||0)*c.price);});
  const body=rows.map(r=>{ const k=r.qty*r.price; sum+=k;
    return `<tr class="r1"><td class="n">${esc(no)}</td><td class="cd" colspan="2">${esc(r.code)}</td>
        <td class="n">${ymd(date)}</td><td></td><td></td></tr>
      <tr class="r2"><td></td><td class="pn" colspan="2">${esc(r.name)}</td>
        <td class="n">${tankaJ(r.price)}</td><td class="n">${n(r.qty)}</td><td class="n">${n(Math.round(k))}</td></tr>`;
  }).join("");
  document.getElementById("delivSum").textContent=yen(sum);
  document.getElementById("juryoOut").innerHTML= rows.length? `<div class="scaler"><div class="sheet">
    <h1 class="doc-title"><span>委託商品受領書</span></h1>
    <div class="issuer"><div>${ymdJ(date)}</div>
      <div class="addr">${ISSUER.addr}</div><div class="corp">${ISSUER.corp}</div></div>
    <div class="addressee"><div class="nm">${esc(S.worker[1])} 様</div>
      <div class="ct">${ PUBLIC_DEMO
          ? '<span style="color:#999">（郵便番号）<br>（電話番号）</span>'
          : esc(S.worker[2])+"<br>"+esc(S.worker[3]) }</div></div>
    <table class="two-line"><colgroup><col style="width:9%"><col style="width:14%"><col>
      <col style="width:12%"><col style="width:9%"><col style="width:12%"></colgroup>
      <thead><tr><th class="n">伝票番号</th><th colspan="2">商品コード</th>
        <th class="n">受領日</th><th></th><th></th></tr>
        <tr><th></th><th colspan="2" style="padding-left:24px">商品名</th>
        <th class="n">単価</th><th class="n">納入数計</th><th class="n">金額</th></tr></thead>
      <tbody>${body}</tbody><tfoot><tr class="total-rule"><td colspan="6"></td></tr></tfoot></table>
    <div class="total"><div class="box"><span>お支払予定金額</span><span class="amt">${yen(sum)}</span></div></div>
  </div></div>` : `<div class="warn">今回納入する数量が 0 です。上の欄に数を入れてください。</div>`;
  fitSheets(); if(rows.length) schedulePdf("juryo");
}
function commitDelivery(){
  delivRows().forEach(r=>{ S.delivered[r.code]=(S.delivered[r.code]||0)+r.qty; });
  drawDelivery(); renderJuryo();
  alert("納入を確定しました。残数に反映しています（分納の確認用）。");
}

/* ---------- PDFを作って共有する ----------
   iOS は「タップから間があくと共有シートを開かせない」ため、
   PDF は画面を出した時点で先に作っておき、タップ時は共有するだけにする。 */
const PDFC={itaku:{key:"",blob:null,building:null},juryo:{key:"",blob:null,building:null}};

let PDF_ERR="";
async function buildPdf(kind){
  const host=document.getElementById(kind==="itaku"?"itakuOut":"juryoOut");
  const sheet=host.querySelector(".sheet");
  if(!sheet){ PDF_ERR="用紙がまだ描画されていません"; return null; }
  const okC=await loadLib("html2canvas"), okP=await loadLib("jspdf");
  if(!okC||!okP){ PDF_ERR="PDF作成用のライブラリを読み込めませんでした（通信環境をご確認ください）"; return null; }
  const prev=sheet.style.transform;
  sheet.style.transform="none";                       // 縮小したまま撮ると解像度が落ちる
  try{
    const canvas=await html2canvas(sheet,{scale:2,backgroundColor:"#ffffff",
      width:sheet.offsetWidth,height:sheet.offsetHeight,
      windowWidth:sheet.offsetWidth,windowHeight:sheet.offsetHeight,scrollX:0,scrollY:0});
    const doc=new jspdf.jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
    doc.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",0,0,297,210,undefined,"FAST");
    return doc.output("blob");
  }catch(e){ console.error(e); PDF_ERR="用紙をPDFに変換できませんでした："+e.message; return null; }
  finally{ sheet.style.transform=prev; }
}

function pdfKey(kind){
  const no=document.getElementById("slipNo").value||NEXT_NO;
  return kind+"|"+no+"|"+(S.worker?S.worker[0]:"")+"|"+JSON.stringify(S.cart)
    +"|"+(kind==="juryo"?JSON.stringify(delivRows())+document.getElementById("jryDate").value:document.getElementById("hikiwatasi").value);
}
function preparePdf(kind){
  const key=pdfKey(kind), c=PDFC[kind];
  if(c.key===key && (c.blob||c.building)) return;
  c.key=key; c.blob=null;
  c.building=buildPdf(kind).then(b=>{ if(c.key===key) c.blob=b; c.building=null; return b; });
}

function pdfName(kind){
  const no=document.getElementById("slipNo").value||NEXT_NO;
  return (kind==="itaku"?"委託伝票_":"受領書_")+no+".pdf";
}

async function shareSheet(kind){
  const label=kind==="itaku"?"商品加工委託伝票":"委託商品受領書";
  const no=document.getElementById("slipNo").value||NEXT_NO;
  const text=`${S.worker[1]} 様\n${label}（伝票番号 ${no}）をお送りします。`;
  const c=PDFC[kind];
  let blob=c.blob;
  if(!blob && c.building) blob=await c.building;
  if(!blob){ preparePdf(kind); blob=await c.building; }

  if(blob){
    const file=new File([blob],pdfName(kind),{type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:label,text}); return; }
      catch(e){ if(e.name==="AbortError") return; }
    }
    // 共有シートがPDFを受け付けない端末は、いったん保存してから手で送る
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=pdfName(kind);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    alert("この端末は共有シートにPDFを渡せないため、PDFを保存しました。\n保存先のファイルから LINE に送ってください。");
    return;
  }
  alert("PDFを作れませんでした。\n\n理由: "+(PDF_ERR||"不明")
    +"\n\n「印刷 / PDFにする」から PDF として保存し、そのファイルを共有する方法は使えます。");
}

/* ---------- 用紙の自動縮小（見切れ防止） ---------- */
const SHEET_PX=297/25.4*96;   // A4横 = 1122.5px 相当

/* 用紙は入力欄より広い。アプリの列（640px）に押し込めると右が切れるので、
   プレビュー欄だけ列からはみ出させ、その幅を基準に縮小率を出す。
   基準をウィンドウ幅にすると、広い画面で「縮小不要」と誤判定して切れる。 */
function fitSheets(){
  const vw=document.documentElement.clientWidth;
  const app=document.querySelector(".app");
  const inner=app.clientWidth-24;                       // .app の内寸
  const wpx=Math.max(inner, Math.min(SHEET_PX+8, vw-24)); // プレビュー欄の幅
  document.querySelectorAll(".printarea").forEach(pa=>{
    pa.style.width=wpx+"px";
    pa.style.marginLeft=((inner-wpx)/2)+"px";           // 列の中央に合わせて外へ広げる
  });
  const avail=wpx-8;
  const fit=Math.min(1,avail/SHEET_PX);
  const s=(S.zoom==="full")?1:fit;
  document.querySelectorAll(".scaler").forEach(w=>{
    const sh=w.querySelector(".sheet");
    sh.style.transform = s<1 ? `scale(${s})` : "";
    if(S.zoom==="full" && fit<1){
      w.style.overflowX="auto"; w.style.width=avail+"px"; w.style.height="";
    }else{
      w.style.overflowX="hidden";
      w.style.width  = s<1 ? Math.floor(SHEET_PX*s)+"px" : "";
      w.style.height = s<1 ? Math.ceil(sh.offsetHeight*s)+"px" : "";
    }
  });
  const b=document.getElementById("zoom2");
  if(b){ b.hidden=fit>=1; b.textContent=S.zoom==="fit"?"原寸で見る":"画面に合わせる"; }
}
function toggleZoom(){ S.zoom=S.zoom==="fit"?"full":"fit"; fitSheets(); }
addEventListener("resize",fitSheets);
addEventListener("orientationchange",fitSheets);
